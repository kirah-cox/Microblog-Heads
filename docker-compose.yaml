services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: microblog-app
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    volumes:
      # Uploaded pictures are saved straight into the repo's Media folder so they can be committed.
      - ./Media:/app/Media
    restart: unless-stopped
